[project]
name = "mini_llm"
version = "0.1.0"
description = "an complete large language model and tokenization system written from scratch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "tensorflow>=2.21.0",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "tqdm>=4.70.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_llm"]
